# figspec journal figure-specification registry
#
# CONTRACT FOR THIS FILE
#
#   Two kinds of information live here and they must never be mixed.
#
#   requirements:  What the publisher STATES in its author guidelines.
#                  Sourced, auditable, and the only thing figspec will check a
#                  figure against or report as pass/fail. If a publisher does
#                  not state something, OMIT it. Never guess, never carry a
#                  value over from a sibling journal, never infer one from a
#                  published figure. An omitted field is reported as "not
#                  specified by publisher", which is NOT the same as "passes".
#
#   house_style:   What a journal SUBJECTIVELY looks like. Taste, not rule.
#                  Optional. Never checked, never enforced, never reported as a
#                  requirement. Applied underneath requirements, so a house
#                  style can never push a figure out of compliance.
#
#   source_url and verified_on are REQUIRED on every entry.
#   source_quote_* holds the publisher wording for load-bearing numbers so an
#   entry can be audited without leaving this file.
#   not_stated:    Fields somebody READ the publisher page for and confirmed
#                  the publisher does not state. This is different from a
#                  field nobody has looked at yet. figspec reports the first
#                  as "not specified by publisher" and the second as "not yet
#                  harvested", because only the first is a fact about the
#                  publisher; the second is a fact about this registry.
#
# Units: widths/heights in millimetres, type sizes in points, files in MB.

schema_version: 2
journals:
- id: plos_one
  name: PLOS ONE
  publisher: PLOS
  disciplines: multidisciplinary
  source_url: https://journals.plos.org/plosone/s/figures
  verified_on: '2026-08-21'
  requirements:
    width_min_mm: 66.8
    width_max_mm: 190.5
    height_max_mm: 222.25
    source_quote_width: 'Minimum width: 6.68 cm (2.63 inches); Maximum width: 19.05
      cm (7.5 inches)'
    dpi_min: 300
    dpi_max: 600
    source_quote_dpi: Submit figures at the desired dimensions with a resolution no
      greater than 300-600 dpi.
    formats:
    - tiff
    - eps
    font_families:
    - Arial
    - Times
    - Symbol
    font_min_pt: 8
    font_max_pt: 12
    source_quote_font: Use only Arial, Times, or Symbol font in 8-12 point.
    colour_mode:
    - RGB
    - grayscale
    max_file_mb: 10
- id: nature
  name: Nature
  publisher: Springer Nature
  disciplines: multidisciplinary
  source_url: https://www.nature.com/nature/for-authors/formatting-guide
  verified_on: '2026-08-21'
  requirements:
    columns:
      single: 90
      double: 180
    source_quote_width: For guidance, Nature's standard figure sizes are 90 mm (single
      column) and 180 mm (double column) and the full depth of the page is 170 mm.
    height_max_mm: 170
    text_case: sentence
    text_no_final_stop: yes
    source_quote_text_case: Lettering in figures (labelling of axes and so on) should
      be in lower-case type, with the first letter capitalized and no full stop.
  tables:
    orientation: portrait
    title_style: short, one-line title in bold text
    source_quote: Tables should each be presented on a separate page, portrait (not
      landscape) orientation, and upright on the page, not sideways. Tables have a
      short, one-line title in bold text. Tables should be as small as possible.
    notes: |
      Symbols and abbreviations are defined immediately below the table, followed by essential descriptive material, all in double-spaced text.
  notes: |
    Figure legends should be fewer than 300 words each. Lettering in figures should be lower-case with the first letter capitalized and no full stop. Scale bars should be used rather than magnification factors. This entry records the formatting guide; Nature asks for production-quality figures only after acceptance in principle, under a separate figure guide.
- id: cell_press
