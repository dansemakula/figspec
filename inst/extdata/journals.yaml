    width_max_mm: 190.5
    height_max_mm: 222.25
    source_quote_width: 'Minimum width: 6.68 cm (2.63 inches); Maximum width: 19.05
      cm (7.5 inches)'
    dpi_min: 300
    dpi_max: 600
    source_quote_dpi: Submit figures at the desired dimensions with a resolution no
      greater than 300-600 dpi.
    formats:
    - tiff
    - eps
    font_families:
    - Arial
    - Times
    - Symbol
    font_min_pt: 8
    font_max_pt: 12
    source_quote_font: Use only Arial, Times, or Symbol font in 8-12 point.
    colour_mode:
    - RGB
    - grayscale
