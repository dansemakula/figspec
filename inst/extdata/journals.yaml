  - humanities
  source_url: https://authorservices.taylorandfrancis.com/publishing-your-research/making-your-submission/submit-electronic-artwork/
  verified_on: '2026-08-22'
  requirements:
    dpi_min: 300.0
    dpi_bw: 600.0
    dpi_line_art: 1200.0
    dpi_combination: 600.0
    source_quote_dpi: Color photographic images - 300dpi; Grayscale photographic images
      - 600dpi; Line art or monochrome images - 1200dpi; Combination images (photographs
      and labelling) - 600dpi
    min_line_pt: 0.3
    source_quote_line: Any lines are a minimum of 0.3pt
    font_families:
    - Times
    - Helvetica
    - Arial
    - Symbol
    source_quote_font: Use standard fonts such as Times, Helvetica, Arial, and Symbol.
      All fonts should be embedded in the image files.
    formats:
    - jpeg
    - tiff
    - eps
    print_greyscale: yes
    source_quote_greyscale: All images and figures will be reproduced in black and
      white in the printed journal, but in color in the online journal free of charge.
  not_stated: columns
  notes: Taylor & Francis states no column width in its general artwork guide and
    directs authors to the individual journal page. Files should be named Figure 1,
    2, 3 in order of appearance.
- id: agu
  name: American Geophysical Union journals
  publisher: AGU (Wiley)
  disciplines:
  - earth-sciences
  - space-science
  - environment
  source_url: https://www.agu.org/publications/authors/journals/text-graphics-requirements
  verified_on: '2026-08-22'
  requirements:
    formats:
    - jpeg
    - tiff
    - eps
    - ps
    - pdf
    source_quote_formats: 'AGU recommends that figures be prepared in one of the following
      formats: JPG, TIFF, EPS, PS or PDF.'
    panel_labels: lowercase
    source_quote_panel_labels: Use lowercase letters (a, b, c...) to label parts of
      the figure; do not use Arabic or Roman numerals.
  not_stated:
  - columns
  - dpi_min
  notes: AGU strongly encourages, but does not require, figures accessible to readers
    with colour vision deficiency, naming rainbow-like and red-green palettes specifically,
    and recommends patterns or symbols alongside colour so meaning does not rest on
    colour alone. Because that is framed as encouragement rather than a rule, it is
    not recorded as a requirement that can fail. An Internet Archive snapshot of the
    older URL from 2024 stated 300-600 ppi and a 0.5 point line minimum; that text
    is not on the live page, so it is not recorded.
- id: mdpi
  name: MDPI journals
  publisher: MDPI
  disciplines:
  - multidisciplinary
  source_url: https://www.mdpi.com/journal/sensors/instructions
  verified_on: '2026-08-22'
  requirements:
    dpi_min: 600.0
    source_quote_dpi: All figures should be of a high quality (preferably no less
      than 600 dpi) in PNG, JPEG or TIFF formats.
    formats:
    - png
    - jpeg
    - tiff
  not_stated:
  - columns
  notes: MDPI phrases its resolution rule as preferably no less than 600 dpi, which
    is a preference rather than an absolute floor; the wording is kept in the entry
    so a reviewer can judge it. Read from the shared instructions template as served
    on the Sensors journal page; a journal-specific page overrides it.

