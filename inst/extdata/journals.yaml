- id: nature
  name: Nature
  publisher: Springer Nature
  disciplines: multidisciplinary
  source_url: https://www.nature.com/nature/for-authors/initial-submission
  verified_on: '2026-08-22'
  requirements:
    columns:
      single: 90
      double: 180
    source_quote_width: For guidance, Nature's standard figure sizes are 90 mm (single
      column) and 180 mm (double column) and the full depth of the page is 170 mm.
    height_max_mm: 170
    text_case: sentence
    text_no_final_stop: yes
    source_quote_text_case: Lettering in figures (labelling of axes and so on) should
      be in lower-case type, with the first letter capitalized and no full stop.
    dpi_min: 300.0
    source_quote_dpi: Provide images in RGB color and at 300 dpi or higher resolution.
    colour_mode: RGB
    font_families:
    - Arial
    - Helvetica
    source_quote_font_family: Use the same typeface (Arial or Helvetica) for all figures.
      Use symbol font for Greek letters.
    font_min_pt: 5.0
    font_max_pt: 7.0
    source_quote_font: Figures are best prepared at a width of 90 mm (single column)
      and 180 mm (double column) with a maximum height of 170mm. At this size, the
      font size should be 5-7pt.
    formats:
    - ai
    - eps
    - pdf
    - ps
    - svg
    - psd
    - tiff
    - png
    - jpeg
    - ppt
    - cdx
    avoid_colour_pairs:
    - - red
      - green
    source_quote_colour_pairs: Use distinct colors with comparable visibility and
      avoid the use of red and green for contrast.
    panel_labels: lowercase
    source_quote_panel_labels: Separate panels in multi-panelled figures should be
      labelled with 8-pt bold, upright (not italic) and lowercase a, b, c, etc.
    axis_lines_and_ticks: yes
    source_quote_axes: Axis lines and tick marks to be included
    avoid_coloured_text: yes
    source_quote_text_colour: Avoid coloured text; keylines, keys, etc. should be
      used instead
  tables:
    orientation: portrait
    title_style: short, one-line title in bold text
    source_quote: Tables should each be presented on a separate page, portrait (not
      landscape) orientation, and upright on the page, not sideways. Tables have a
      short, one-line title in bold text. Tables should be as small as possible.
    notes: |
      Symbols and abbreviations are defined immediately below the table, followed by essential descriptive material, all in double-spaced text.
  notes: Widths and maximum height are corroborated by Nature s formatting guide at
    a different URL, harvested a day earlier. Nature strongly encourages recolouring
    primary data to colour-safe combinations such as green and magenta, and says the
    rainbow colour scale should be avoided; both are encouragement rather than rules
    and are not graded. Two Nature author pages give different figure-legend word
    limits, under 250 on the initial-submission page and fewer than 300 in the formatting
    guide; neither is recorded. A third Nature page, the research figure guide at
    research-figure-guide.nature.com/figures/preparing-figures-our-specifications/,
    independently states the same Arial or Helvetica typeface and the same 5 to 7
    pt range, and adds panel labelling, axis furniture and the rule against coloured
    text. It states no widths, which is why source_url stays on the initial-submission
    page. It also gives 450 dpi figures in an export section while saying the maximum
    dpi of online proofs is 450; the proof figure describes Nature s rendering, so
    dpi_min stays at the 300 that two pages state for photographic images. It asks
    for scale bars rather than magnification factors, axes labelled with units in
    parentheses, an accessible colour palette citing Wong on colour blindness, Symbol
    font for Greek, embedded fonts and no outlined text; none of those is checked
    yet.
