- id: royal_society
  name: Royal Society journals
  publisher: The Royal Society
  disciplines: multidisciplinary
  source_url: https://royalsociety.org/journals/authors/author-guidelines/
  verified_on: '2026-08-22'
  requirements:
    formats:
    - png
    - eps
    - tiff
    - jpeg
    font_families: Times New Roman
    font_min_pt: 7.5
    print_greyscale: yes
    source_quote_greyscale: All figures will be published in colour online (the version
      of the record), but will be reproduced in black and white in any print versions
      by default
    source_quote_font: 9pt, 11pt leading is preferred. Text can be reduced, where
      necessary or restricted for space, but should be no smaller than 7.5pt
    panel_labels: lowercase
    source_quote_panel_labels: Figure parts should be labelled alphabetically and
      in a consistent manner (left to right, then top to bottom) ... Alphabetical
      labels should be italicized in roman brackets, e.g. (a)
    thousands_separator: a thin space
    source_quote_numbers: In numbers, thousands should be separated by thin spaces,
      not commas (e.g. 10 000 000)
  notes: 'Figure parts are labelled alphabetically, left to right then top to bottom,
    all in the same position, with alphabetical labels italicised in round brackets
    and sub-parts in bracketed roman numerals. figspec checks which tag level is used,
    not its styling, so the italics and brackets are not checked. Worth noting that
    Nature requires panel labels UPRIGHT, not italic, while the Royal Society requires
    them italicised: a direct conflict between two publishers, and a reason per-journal
    specs matter. The Royal Society also asks for a thin space between a value and
    its unit and a full space either side of an equals sign; neither is checked, only
    the thousands separator. Figures are published in colour online but reproduced
    in black and white in print by default.'
  not_stated:
  - columns
  - dpi_min
  tables:
