  - biomedical
  source_url: https://www.cell.com/information-for-authors/figure-guidelines
  verified_on: '2026-08-21'
  requirements:
    columns:
      single: 85
      onehalf: 114
      double: 174
    source_quote_width: 'Two-column formats (such as research articles and reviews):
      8.5 cm (1 column), 11.4 cm (1.5 columns), and 17.4 cm (full width of the page)'
    height_max_mm: 200
    dpi_min: 300
    dpi_line_art: 1000
    dpi_bw: 500
    source_quote_dpi: for color or grayscale figures, at least 300 dpi; for black
      and white figures, at least 500 dpi; for line-art figures, at least 1,000 dpi
      at the desired print size
    formats:
    - tiff
    - pdf
    - eps
    - jpeg
    font_families: Arial
    font_min_pt: 6
    font_max_pt: 8
    source_quote_font: Text should be about 6-8 pt at the desired print size
    colour_mode: RGB
    max_file_mb: 20
    min_line_pt: 0.5
    max_line_pt: 1.5
    avoid_colour_pairs:
    - - red
      - green
    source_quote_colour_pairs: To accommodate all viewers, red and green should not
      be used together
    panel_labels: uppercase
    source_quote_panel_labels: Different panels should be labeled with capital letters
  notes: |
    Cell Press also publishes a three-column format for previews and commentaries with widths 5.5 cm, 11.4 cm and 17.4 cm. Red and green should not be used together.
