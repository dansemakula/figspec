- id: aps
  name: American Physical Society journals
  publisher: American Physical Society
  disciplines: physics
  source_url: https://journals.aps.org/authors/style-basics
  verified_on: '2026-04-04'
  requirements:
    columns:
      single: 85.0
    source_quote_width: Size to the width of a single manuscript column (8.5 cm or
      3 3/8 in) or 1.5 or 2 columns for more detailed figures.
    min_line_pt: 0.5
    source_quote_line: 0.18 mm (0.5 point)
  notes: 'Retrieved from an Internet Archive snapshot dated 2026-04-04; the live page
    refuses automated access, so verified_on records the snapshot date and the live
    page may since have changed. APS also states a minimum capital-letter height of
    2 mm and a minimum data point diameter of 1 mm. Neither is recorded as a requirement
    field: capital-letter height is not font size, and converting between them would
    be an inference rather than the publisher wording. Its 600 dpi guidance applies
    to scanned images specifically, not to figures in general, so no resolution minimum
    is recorded.'
- id: elsevier
  name: Elsevier journals
  publisher: Elsevier
  disciplines: multidisciplinary
  source_url: https://www.elsevier.com/about/policies-and-standards/author/artwork-and-media-instructions/artwork-sizing
  verified_on: '2026-08-22'
  requirements:
    columns:
      single: 90.0
      onehalf: 140.0
      double: 190.0
    width_min_mm: 30.0
    source_quote_width: Minimal size 30 mm | Single column 90 mm | 1.5 column 140
      mm | Double column (full width) 190 mm
    dpi_min: 300.0
    dpi_combination: 500.0
    dpi_line_art: 1000.0
    source_quote_dpi: 300 DPI for halftone images; 500 DPI for combination art; 1000
      DPI for line art.
    font_min_pt: 6.0
    source_quote_font: the lettering on the artwork should have a finished, printed
      size of 7 pt for normal text and no smaller than 6 pt for subscript and superscript
      characters
  notes: Elsevier calls its 7 pt lettering target a rule-of-thumb rather than a strict
    rule and notes that other factors may dictate about 10 pt, so only the 6 pt floor
    is recorded and no ceiling. Elsevier also states that some of its publications
    have special instructions beyond these common guidelines, so the journal-specific
    guide for authors takes precedence.
- id: taylor_francis
  name: Taylor & Francis and Routledge journals
  publisher: Taylor & Francis
  disciplines:
  - multidisciplinary
