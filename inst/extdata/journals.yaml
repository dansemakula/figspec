# figspec journal figure-specification registry
#
# CONTRACT FOR THIS FILE
#
#   Two kinds of information live here and they must never be mixed.
#
#   requirements:  What the publisher STATES in its author guidelines.
#                  Sourced, auditable, and the only thing figspec will check a
#                  figure against or report as pass/fail. If a publisher does
#                  not state something, OMIT it. Never guess, never carry a
#                  value over from a sibling journal, never infer one from a
#                  published figure. An omitted field is reported as "not
#                  specified by publisher", which is NOT the same as "passes".
#
#   house_style:   What a journal SUBJECTIVELY looks like. Taste, not rule.
#                  Optional. Never checked, never enforced, never reported as a
#                  requirement. Applied underneath requirements, so a house
#                  style can never push a figure out of compliance.
#
#   source_url and verified_on are REQUIRED on every entry.
#   source_quote_* holds the publisher wording for load-bearing numbers so an
#   entry can be audited without leaving this file.
#   not_stated:    Fields somebody READ the publisher page for and confirmed
#                  the publisher does not state. This is different from a
#                  field nobody has looked at yet. figspec reports the first
#                  as "not specified by publisher" and the second as "not yet
#                  harvested", because only the first is a fact about the
#                  publisher; the second is a fact about this registry.
#
#   RECORDING HEDGED WORDING
#
#     Publishers hedge constantly, and the hedge is not what decides. What
#     decides is the MAIN VERB of the sentence that states the rule.
#
#     1. A hedge about the DOCUMENT does not downgrade a rule inside it.
#        OUP calls its whole guide "tips rather than strict rules", then says
#        "at least 300dpi for colour half-tones". That is recorded as a
#        requirement: the hedge concerns whether an author can always achieve
#        a target, not whether the target applies. Confirmed 2026-08-22.
#
#     2. A hedge about ACHIEVABILITY does not downgrade a rule either.
#        Elsevier calls its 7 pt lettering "a rule-of-thumb rather than a
#        strict rule" and still says "no smaller than 6 pt". Recorded.
#
#     3. A rule whose MAIN VERB is a recommendation goes in an advisory field
#        and is REPORTED BUT NEVER GRADED. Sage says "We recommend having no
#        more than 7 series": the verb is recommend, so it is
#        max_series_recommended, and a figure with ten series is reported, not
#        failed. Compare MDPI's "should be ... preferably no less than 600
#        dpi", where the verb is should and preferably only softens it.
#
#     4. A LIST is recorded only where the publisher CLOSES it. PLOS says
#        "Use only Arial, Times, or Symbol font", which excludes everything
#        else, so font_families is recorded. ACS says Helvetica or Arial
#        "work well" and Springer that it "is best to use" them; neither
#        excludes anything, so neither is recorded.
#
#     When in doubt, do not grade. An unrecorded rule costs a user a check.
#     A wrongly graded one tells them they broke a rule that does not exist.
#

schema_version: 2
journals:
