url: https://dansemakula.github.io/figspec

template:
  bootstrap: 5
  bslib:
    primary: "#1f4e5f"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Fit your plots to your journal's figure requirements
  description: >
    figspec lets you fit your plots to your target journal's published figure
    requirements, or check whether they already meet them, without looking
    those requirements up every time. It brings the requirements of 27
    publishers into your R session as data, builds your figure to meet them,
    and exports it at exactly the stated size and resolution.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Meeting a journal's figure requirements
        href: articles/figspec.html
      - text: Which journal am I submitting to?
        href: articles/journals.html
      - text: "The registry: provenance, and adding your own"
        href: articles/registry.html

authors:
  Daniel Semakula:
    href: https://github.com/dansemakula

reference:
- title: Checking a figure
  desc: What a journal requires, and whether this figure meets it.
  contents: [check_journal, check_colour_safety, check_submission, submission_detail, suggest_art_type]
- title: Building a compliant figure
  contents: [theme_journal, ggsave_journal, figspec_preview, figspec_linewidth, figspec_shapes, figspec_linetypes]
- title: Colour
  contents: [figspec_palettes, figspec_palette, scale_colour_figspec, journal_palette]
- title: R Markdown and Quarto
  contents: [figspec_chunk_opts, figspec_knitr_setup]
- title: Looking things up
  contents: [journals, journal_spec, fig_width, fig_columns, table_spec, media_spec, check_media, graphical_abstract_spec]
- title: Moving between journals
