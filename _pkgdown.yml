authors:
  after: |
    ### About the author and maintainer

    Daniel Semakula earned his medical degree from Makerere University in
    Uganda and has spent most of his career as a physician-researcher. He
    earned a Master of Public Health from the University of Manchester in the
    United Kingdom and completed a PhD at the University of Oslo in Norway. He
    worked at Johns Hopkins University, first as a postdoctoral fellow and
    later as a Senior Research Data Analyst in the School of Medicine's
    Divisions of Hematology and General Internal Medicine. He has more than 15
    years of experience analysing data and advising on data analysis for
    student- and staff-led research projects. He also serves as an academic
    editor for two international journals.

    **Profiles:** [ORCID](https://orcid.org/0000-0002-0806-213X) ·
    [Google Scholar](https://scholar.google.com/citations?user=rGFrKbcAAAAJ) ·
    [GitHub](https://github.com/dansemakula/figspec)

  Daniel Semakula:
    href: https://github.com/dansemakula/figspec
    html: "Daniel Semakula, MD, MPH, PhD"

