reference:
- title: Building, checking and exporting a figure
  desc: >
    The main workflow: apply a specification when you have one, export at an
    exact canvas or panel size, inspect the resulting geometry, and verify the
    plot or finished file. Open any function for its arguments and runnable
    examples.
  contents: [fig_save, fig_check, fig_geometry, fig_apply_spec, fig_preview]
- title: Size and align figures
  desc: >
    Control the plotting area itself—not only the surrounding image—and give
    a set of figures matching panels even when their labels, legends and
    margins differ. Use a published width or supply your own dimensions.
  contents: [fig_panel_size, fig_panel_width]
- title: Apply and reuse visual standards
  desc: >
    Combine typographic requirements with a project or organisation's house
    style, choose suitable line weights, and label multi-panel figures
    consistently.
  contents: [theme_spec, style_register, style_list, style_remove, style_save, style_load, fig_tag_panels, spec_linewidth]
- title: Colour and visual distinction
  desc: >
    Choose colours, shapes and line types that remain distinguishable in
    print and for readers with common colour-vision deficiencies, then check
    the choices in a real plot.
  contents: [colour_safety_check, figspec_palettes, figspec_palette, scale_colour_figspec, scale_fill_figspec, scale_shape_figspec, figspec_shapes, figspec_linetypes, spec_style_palette]
- title: Find and use specifications
  desc: >
    Browse the included publisher and journal profiles, inspect their recorded
    requirements, retrieve stated widths, or save and load requirements
    maintained by your own team. A specification can be a registry profile or
    a named set of requirements supplied directly in R.
  contents: [spec_list, spec_get, fig_width, fig_columns, spec_register, spec_save, spec_load]
- title: Check collections and publication assets
  desc: >
    Review figures and tables together, choose the appropriate resolution
    rule, adapt a figure set to another destination, and inspect requirements
    for supplementary media and graphical abstracts.
  contents: [submission_check, submission_detail, fig_suggest_art_type, fig_refit, media_spec, media_check, graphical_abstract_spec]
- title: Build, export and check tables
  desc: >
    Apply table requirements to data frames and tables made with gt,
    flextable, kableExtra or grid; export through the table's own system; and
    verify the editable object together with the completed file.
  contents: [table_spec, table_apply_spec, table_save, table_check]
- title: R Markdown and Quarto
  desc: >
    Carry the same dimensions and output requirements into reproducible
    reports so figures are generated consistently whenever the document is
    rebuilt.
  contents: [figspec_knitr_options, figspec_knitr_setup]
- title: Maintain trusted registry data
  desc: >
    See how complete and current each bundled profile is, recheck its cited
    sources, and validate new or updated registry entries before sharing them.
  contents: [registry_status, registry_stale_entries, registry_check_sources, registry_entry_template, registry_validate_file]
