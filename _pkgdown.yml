url: https://dansemakula.github.io/figspec

template:
  bootstrap: 5
  bslib:
    primary: "#1f4e5f"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Fit your plots to your journal's figure requirements
  description: >
    Journals publish precise rules for the figures you submit: column widths to
    the millimetre, minimum resolution, which file formats they take, how small
    type is allowed to get. The rules differ between publishers and are
    scattered across author-guideline pages. figspec keeps them in one place,
    applies them to your ggplot2 figures, and tells you where a figure would
    fail.

navbar:
  structure:
    left: [intro, reference, options, articles, news]
    right: [search, github]
  components:
    options:
      text: Options
      href: articles/options.html
    articles:
      text: Articles
      menu:
      - text: Meeting a journal's figure requirements
        href: articles/figspec.html
      - text: Which journal am I submitting to?
        href: articles/journals.html
      - text: Every function and what its options do
        href: articles/options.html
      - text: "The registry: provenance, and adding your own"
        href: articles/registry.html

authors:
  Daniel Semakula:
    href: https://github.com/dansemakula

