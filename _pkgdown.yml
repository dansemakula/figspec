url: https://dansemakula.github.io/figspec

template:
  bootstrap: 5
  bslib:
    primary: "#1a7391"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Build, check and export figures to a specification
  description: >
    figspec sizes a figure by its plot panel as well as by the image, exports
    it at exactly that size and resolution, and then checks the result and says
    where it falls short. Its main registry holds the published figure
    requirements of 27 publishers - column widths to the millimetre, minimum
    resolution, accepted formats, how small type may get - so a target journal
    can be named instead of a specification written. Every registry requirement
    records the page it came from and the date it was read.

