url: https://dansemakula.github.io/figspec

template:
  bootstrap: 5
  bslib:
    primary: "#1a7391"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Build, export and verify figures and tables against a specification
  description: >
    figspec enables researchers and other R users to build, export and verify
    figures and tables against requirements from publications, organisations
    and individual projects. It applies supported requirements while the work
    is still editable, checks the exported result and gives users a clear list
    of what is complete and what still needs attention.

